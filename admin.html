<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BKK-CUTZ Admin</title>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      min-height: 100vh;

      font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;

      background: #f4f5f7;

      color: #222222;
    }


    button,
    input,
    select {
      font-family: inherit;
    }


    .hidden {
      display: none !important;
    }


    /* ================================
       LOADING
    ================================= */

    .loading-page {
      min-height: 100vh;

      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 18px;
    }


    .loading-brand {
      font-size: 24px;
      font-weight: 800;

      letter-spacing: 3px;
    }


    .spinner {
      width: 42px;
      height: 42px;

      border: 4px solid #dddddd;
      border-top-color: #222222;
      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }


    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }


    /* ================================
       LOGIN
    ================================= */

    .login-page {
      min-height: 100vh;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 20px;
    }


    .login-card {
      width: 100%;
      max-width: 440px;

      padding: 32px;

      border: 1px solid #e5e5e5;
      border-radius: 24px;

      background: white;

      box-shadow:
        0 8px 28px rgba(0, 0, 0, 0.07);
    }


    .brand {
      margin-bottom: 24px;

      text-align: center;

      font-size: 20px;
      font-weight: 800;

      letter-spacing: 2px;
    }


    .login-card h1 {
      margin: 0 0 8px;

      text-align: center;
    }


    .subtitle {
      margin: 0 0 28px;

      text-align: center;

      color: #888888;
    }


    label {
      display: block;

      margin: 16px 0 7px;

      font-weight: 700;
    }


    input,
    select {
      width: 100%;

      min-height: 48px;

      padding: 10px 13px;

      border: 1px solid #d5d5d5;
      border-radius: 10px;

      background: white;

      font-size: 16px;

      outline: none;
    }


    input:focus,
    select:focus {
      border-color: #222222;
    }


    .main-button {
      width: 100%;

      min-height: 54px;

      margin-top: 22px;

      border: none;
      border-radius: 12px;

      background: #222222;

      color: white;

      font-size: 17px;
      font-weight: 700;

      cursor: pointer;
    }


    .error-box {
      margin-top: 15px;

      padding: 12px;

      border-radius: 10px;

      background: #eeeeee;
    }


    /* ================================
       ADMIN
    ================================= */

    .admin-app {
      width: 100%;
      max-width: 1100px;

      margin: auto;

      padding: 24px;
    }


    .top-bar {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 20px;

      margin-bottom: 28px;

      padding-bottom: 18px;

      border-bottom: 1px solid #dddddd;
    }


    .top-title {
      font-size: 23px;
      font-weight: 800;
    }


    .top-subtitle {
      margin-top: 4px;

      color: #888888;

      font-size: 14px;
    }


    .logout-button {
      padding: 10px 15px;

      border: none;
      border-radius: 10px;

      background: #e5e5e5;

      cursor: pointer;
    }


    /* ================================
       BRANCH
    ================================= */

    .branch-card {
      margin-bottom: 24px;

      padding: 20px;

      border-radius: 18px;

      background: white;

      box-shadow:
        0 4px 16px rgba(0, 0, 0, 0.05);
    }


    .branch-card h2 {
      margin: 0 0 15px;
    }


    /* ================================
       TOOLBAR
    ================================= */

    .toolbar {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 15px;

      margin-bottom: 16px;
    }


    .toolbar h2 {
      margin: 0;
    }


    .add-button {
      padding: 11px 17px;

      border: none;
      border-radius: 10px;

      background: #222222;

      color: white;

      font-weight: 700;

      cursor: pointer;
    }


    /* ================================
       SERVICES
    ================================= */

    .service-list {
      display: flex;

      flex-direction: column;

      gap: 14px;
    }


    .service-card {
      padding: 20px;

      border: 1px solid #e1e1e1;
      border-radius: 16px;

      background: white;

      box-shadow:
        0 3px 12px rgba(0, 0, 0, 0.04);
    }


    .service-top {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 15px;
    }


    .service-name {
      font-size: 19px;
      font-weight: 700;
    }


    .service-price {
      margin-top: 6px;

      color: #666666;
    }


    .service-status {
      padding: 6px 10px;

      border-radius: 20px;

      background: #eeeeee;

      font-size: 13px;
      font-weight: 700;
    }


    .service-actions {
      display: flex;

      gap: 8px;

      margin-top: 16px;
    }


    .edit-button,
    .delete-button {
      padding: 9px 14px;

      border: none;
      border-radius: 9px;

      cursor: pointer;
    }


    .edit-button {
      background: #e7e7e7;
    }


    .delete-button {
      background: #eeeeee;

      color: #555555;
    }


    .empty {
      padding: 40px;

      text-align: center;

      color: #999999;
    }


    /* ================================
       EDIT PANEL
    ================================= */

    .editor {
      margin-top: 28px;

      padding: 24px;

      border-radius: 20px;

      background: white;

      box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.07);
    }


    .editor h2 {
      margin-top: 0;
    }


    .grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 16px;
    }


    .full {
      grid-column: 1 / -1;
    }


    .checkbox-row {
      display: flex;

      align-items: center;

      gap: 10px;

      margin-top: 18px;
    }


    .checkbox-row input {
      width: auto;
      min-height: auto;
    }


    .editor-actions {
      display: flex;

      gap: 10px;

      margin-top: 24px;
    }


    .save-button {
      flex: 1;

      min-height: 52px;

      border: none;
      border-radius: 11px;

      background: #222222;

      color: white;

      font-weight: 700;

      cursor: pointer;
    }


    .cancel-button {
      min-height: 52px;

      padding: 0 20px;

      border: none;
      border-radius: 11px;

      background: #e5e5e5;

      cursor: pointer;
    }


    .status-box {
      margin-top: 15px;

      padding: 12px;

      border-radius: 10px;

      background: #eeeeee;
    }


    @media (max-width: 650px) {

      .admin-app {
        padding: 16px;
      }


      .grid {
        grid-template-columns: 1fr;
      }


      .full {
        grid-column: auto;
      }


      .toolbar {
        align-items: stretch;

        flex-direction: column;
      }


      .add-button {
        width: 100%;
      }

    }

  </style>

</head>


<body>


  <!-- ================================
       LOADING
  ================================= -->

  <section
    id="loadingPage"
    class="loading-page"
  >

    <div class="loading-brand">
      BKK-CUTZ
    </div>

    <div class="spinner"></div>

    <div>
      กำลังตรวจสอบบัญชี...
    </div>

  </section>



  <!-- ================================
       LOGIN
  ================================= -->

  <section
    id="loginPage"
    class="login-page hidden"
  >

    <div class="login-card">

      <div class="brand">
        BKK-CUTZ
      </div>

      <h1>
        Admin
      </h1>

      <p class="subtitle">
        จัดการเมนูและราคาของแต่ละสาขา
      </p>


      <form id="loginForm">

        <label>
          อีเมล
        </label>

        <input
          id="emailInput"
          type="email"
          autocomplete="username"
          required
        >


        <label>
          รหัสผ่าน
        </label>

        <input
          id="passwordInput"
          type="password"
          autocomplete="current-password"
          required
        >


        <div
          id="loginError"
          class="error-box hidden"
        ></div>


        <button
          id="loginButton"
          class="main-button"
          type="submit"
        >
          เข้าสู่ระบบ Admin
        </button>

      </form>

    </div>

  </section>



  <!-- ================================
       ADMIN APP
  ================================= -->

  <main
    id="adminApp"
    class="admin-app hidden"
  >


    <div class="top-bar">

      <div>

        <div class="top-title">
          BKK-CUTZ Admin
        </div>

        <div
          id="adminEmail"
          class="top-subtitle"
        >
          -
        </div>

      </div>


      <button
        id="logoutButton"
        class="logout-button"
        type="button"
      >
        ออกจากระบบ
      </button>

    </div>



    <!-- BRANCH -->

    <section class="branch-card">

      <h2>
        เลือกสาขา
      </h2>

      <select id="branchSelect">

        <option value="">
          -- เลือกสาขา --
        </option>

      </select>

    </section>



    <!-- SERVICES -->

    <section>

      <div class="toolbar">

        <h2>
          เมนูบริการ
        </h2>


        <button
          id="addServiceButton"
          class="add-button"
          type="button"
          disabled
        >
          + เพิ่มเมนู
        </button>

      </div>


      <div
        id="serviceList"
        class="service-list"
      >

        <div class="empty">
          กรุณาเลือกสาขา
        </div>

      </div>

    </section>



    <!-- EDITOR -->

    <section
      id="editor"
      class="editor hidden"
    >

      <h2 id="editorTitle">
        แก้ไขเมนู
      </h2>


      <div class="grid">


        <div>

          <label>
            ชื่อเมนู
          </label>

          <input
            id="serviceNameInput"
            type="text"
          >

        </div>



        <div>

          <label>
            ประเภท
          </label>

          <select id="serviceTypeInput">

            <option value="fixed">
              ราคาปกติ
            </option>

            <option value="choice">
              เลือกราคา
            </option>

            <option value="custom">
              กรอกรายละเอียดและราคาเอง
            </option>

            <option value="free_cut">
              ตัดผมฟรี
            </option>

            <option value="half_cut">
              ส่วนลดค่าตัดผม
            </option>

          </select>

        </div>



        <div id="priceField">

          <label>
            ราคา
          </label>

          <input
            id="servicePriceInput"
            type="number"
            min="0"
          >

        </div>



        <div
          id="choiceField"
          class="hidden"
        >

          <label>
            ตัวเลือกราคา
          </label>

          <input
            id="serviceChoicesInput"
            type="text"
            placeholder="เช่น 150, 200"
          >

        </div>



        <div
          id="discountField"
          class="hidden"
        >

          <label>
            ส่วนลด %
          </label>

          <input
            id="discountPercentInput"
            type="number"
            min="0"
            max="100"
          >

        </div>



        <div>

          <label>
            ลำดับแสดง
          </label>

          <input
            id="sortOrderInput"
            type="number"
            min="1"
          >

        </div>


      </div>



      <label class="checkbox-row">

        <input
          id="activeInput"
          type="checkbox"
        >

        เปิดใช้งานเมนูนี้

      </label>



      <div class="editor-actions">

        <button
          id="saveButton"
          class="save-button"
          type="button"
        >
          บันทึก
        </button>


        <button
          id="cancelButton"
          class="cancel-button"
          type="button"
        >
          ยกเลิก
        </button>

      </div>


      <div
        id="saveStatus"
        class="status-box hidden"
      ></div>

    </section>


  </main>



  <script
    type="module"
    src="admin.js?v=1"
  ></script>


</body>

</html>
