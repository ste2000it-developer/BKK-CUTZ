<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#fff"/>
<title>BKK-CUTZ Admin — Design Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css"/>
<style>*,*::before,*::after{box-sizing:border-box}
:root{--black:#121212;--white:#fff;--line:#dedede;--line-2:#ebebeb;--soft:#f7f7f6;--text:#171717;--muted:#7d7d7d;--accent:#fdc717;--accent-soft:#fff8dc;font-family:"Noto Sans Thai",system-ui,-apple-system,Tahoma,sans-serif;color-scheme:light}
html,body{margin:0;min-height:100%;background:#fff;color:#171717}
button{font:inherit}
/* Temporary blank Admin redesign.
   Keep the complete original header; do not mount old feature pages.
   Scoped classes prevent changes to the production POS. */
.admin-reset-shell {
  min-height: 100vh;
  min-height: 100dvh;
  background: #fff;
  color: #171717;
}

.admin-reset-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  width: 100%;
  padding: 28px 30px 24px;
  border-bottom: 1px solid #e7e7e7;
  background: #fff;
}

.admin-reset-hamburger {
  display: grid;
  place-items: center;
  flex: 0 0 48px;
  width: 48px;
  height: 48px;
  padding: 0;
  border: 1px solid #dedede;
  border-radius: 12px;
  background: #fff;
  color: #171717;
  cursor: pointer;
}
.admin-reset-hamburger:hover { background: #f3f3f3; }
.admin-reset-hamburger-lines { display: flex; flex-direction: column; gap: 5px; width: 24px; }
.admin-reset-hamburger-lines > span {
  display: block; width: 24px; height: 2.5px;
  border-radius: 999px; background: currentColor;
}
.admin-reset-headline { flex: 1 1 auto; min-width: 0; }
.admin-reset-kicker {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.9px;
  color: #888;
}
.admin-reset-headline h1 {
  margin: 3px 0 1px;
  font-size: 38px;
  font-weight: 800;
  letter-spacing: -.5px;
  line-height: 1.25;
}
.admin-reset-email { color: #7d7d7d; font-size: 13px; overflow-wrap: anywhere; }

.admin-reset-header-actions {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 0 0 auto;
}
.admin-reset-header-logout {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  min-height: 44px;
  padding: 0 16px;
  border: 1px solid #f0b4af;
  border-radius: 10px;
  background: #fff1f0;
  color: #b42318;
  font-weight: 700;
  cursor: pointer;
}
.admin-reset-header-logout:hover { border-color: #b42318; background: #ffe0dc; }
.admin-reset-hamburger:focus-visible,
.admin-reset-header-logout:focus-visible,
.admin-reset-menu-dialog button:focus-visible {
  outline: 3px solid #333;
  outline-offset: 3px;
}

.admin-reset-canvas {
  min-height: calc(100dvh - 150px);
  background: #fff;
}

/* Side drawer remains empty until menu redesign, except for sign-out.
   Native modal dialog prevents interaction with the page behind it. */
.admin-reset-menu-dialog {
  position: fixed;
  inset: 0 auto 0 0;
  margin: 0;
  padding: 0;
  width: min(320px, 86vw);
  height: 100vh;
  height: 100dvh;
  max-width: 86vw;
  max-height: 100dvh;
  border: 0;
  border-radius: 0 18px 18px 0;
  background: #fff;
  color: #171717;
  box-shadow: 14px 0 45px rgba(0,0,0,.16);
}
.admin-reset-menu-dialog::backdrop { background: rgba(0,0,0,.44); }
.admin-reset-menu-content { display: flex; flex-direction: column; height: 100%; padding: 12px; }
.admin-reset-menu-close {
  align-self: flex-end;
  display: grid;
  place-items: center;
  width: 48px; height: 48px;
  border: none; border-radius: 12px; background: transparent;
  color: #171717; font-size: 29px; cursor: pointer;
}
.admin-reset-menu-close:hover, .admin-reset-logout:hover { background: #f3f3f3; }
.admin-reset-logout {
  margin-top: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%; min-height: 50px;
  padding: 0 16px;
  border: 1px solid #e4e4e4; border-radius: 12px;
  background: #fff; color: #171717;
  text-align: left; font-size: 15px; font-weight: 700; cursor: pointer;
}

/* One white header on all screens. Only spacing and scale change. */
@media (max-width: 900px) {
  .admin-reset-topbar { padding: 18px 20px; gap: 12px; }
  .admin-reset-headline h1 { font-size: 30px; }
  .admin-reset-header-actions { gap: 8px; }
}
@media (max-width: 600px) {
  .admin-reset-topbar {
    padding: 10px 12px;
    gap: 8px;
  }
  .admin-reset-hamburger {
    flex: 0 0 42px;
    width: 42px;
    height: 42px;
    border-radius: 10px;
  }
  .admin-reset-hamburger-lines { width: 22px; }
  .admin-reset-hamburger-lines > span { width: 22px; }
  .admin-reset-headline { flex: 1 1 0; min-width: 0; }
  .admin-reset-kicker {
    display: block;
    font-size: 8px;
    letter-spacing: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .admin-reset-headline h1 {
    margin: 2px 0;
    font-size: clamp(17px, 5vw, 20px);
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .admin-reset-email {
    display: block;
    font-size: 10px;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .admin-reset-header-actions { gap: 6px; }
  .admin-reset-header-actions .notification-bell,
  .admin-reset-header-logout {
    flex: 0 0 40px;
    width: 40px;
    height: 40px;
    min-height: 40px;
    padding: 0;
  }
  .admin-reset-header-logout span { display: none; }
  .admin-reset-header-logout i { color: #b42318; }
  .admin-reset-canvas { min-height: calc(100dvh - 76px); }
  .admin-reset-header-actions .notification-panel {
    position: fixed;
    top: calc(8px + env(safe-area-inset-top, 0px));
    bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    left: 8px; right: 8px;
    width: auto;
    max-height: calc(100dvh - 16px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    overflow-y: auto;
  }
}

.admin-header-actions { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.notification-center { position: relative; }
.notification-bell { position: relative; display: grid; place-items: center; width: 46px; height: 46px; border: 1px solid var(--line); border-radius: 12px; background: var(--white); color: var(--text); cursor: pointer; }
.notification-badge { position: absolute; top: -7px; right: -8px; min-width: 21px; padding: 2px 5px; border-radius: 20px; background: var(--accent); color: var(--text); font-size: 11px; font-weight: 800; }
.notification-panel { position: absolute; z-index: 100; top: 56px; right: 0; width: min(400px, calc(100vw - 32px)); border: 1px solid var(--line); border-radius: 16px; background: var(--white); box-shadow: 0 12px 36px #0002; overflow: hidden; }
.notification-heading { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--line-2); }
.notification-heading h2 { margin: 0; font-size: 18px; }
.notification-heading small, .notification-footer { color: var(--muted); font-size: 12px; }
.notification-heading button { border: 0; border-radius: 8px; width: 38px; height: 38px; background: var(--soft); cursor: pointer; }
.notification-list { max-height: min(440px, 55dvh); overflow-y: auto; }
.notification-item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 16px; border: 0; border-bottom: 1px solid var(--line-2); background: var(--white); color: var(--text); text-align: left; }
.notification-item.is-unread { background: var(--accent-soft); }
.notification-item:hover { background: var(--soft); }
.notification-copy { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.notification-copy strong, .notification-copy > span { display: block; }
.notification-copy strong { font-size: 14px; }
.notification-copy > span { color: #666; font-size: 12px; margin-top: 4px; }
.notification-icon { display: grid; place-items: center; width: 40px; height: 40px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--soft); color: #555; flex-shrink: 0; }
.notification-icon svg { display: block; width: 22px; height: 22px; }
.notification-icon i { font-size: 18px; }
.notification-bell > i { font-size: 20px; }
.notification-item.is-unread .notification-icon { background: #fff3c4; border-color: #eddfad; color: #725b1d; }
.notification-dot { width: 7px; height: 7px; border-radius: 50%; background: #ad8500; flex-shrink: 0; }
.notification-status, .notification-footer { margin: 0; padding: 14px 16px; }
.notification-footer { border-top: 1px solid var(--line-2); }
.notification-center button:focus-visible { outline: 2px solid var(--text); outline-offset: -3px; }
@media (max-width: 640px) { .admin-topbar { flex-wrap: wrap; } .admin-header-actions { margin-left: auto; } .notification-panel { position: fixed; top: 16px; right: 16px; max-height: calc(100dvh - 32px); overflow-y: auto; } }
.notification-push { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line-2); background: #fafaf9; }
.notification-push > div { min-width: 0; }
.notification-push strong, .notification-push span { display: block; }
.notification-push strong { font-size: 13px; }
.notification-push span { margin-top: 3px; color: var(--muted); font-size: 11px; line-height: 1.35; }
.notification-push button { flex-shrink: 0; min-height: 38px; padding: 0 12px; border: 1px solid #d7d7d7; border-radius: 9px; background: #fff; color: #171717; font-weight: 700; font-size: 12px; cursor: pointer; }
.notification-push button:hover:not(:disabled) { border-color: #9a9a9a; }
.notification-push button.is-enabled { border-color: #badfc9; background: #eaf8ef; color: #16723b; }
.notification-push button:disabled { opacity: .6; cursor: default; }
@media (max-width: 480px) { .notification-push { align-items: stretch; flex-direction: column; } .notification-push button { width: 100%; } }

.preview-dialog { width:min(430px,calc(100vw - 32px));max-height:calc(100dvh - 32px);margin:auto;padding:0;border:0;border-radius:16px;background:white;color:#171717;box-shadow:0 20px 60px #0003;overflow:hidden }
.preview-dialog::backdrop { background:rgba(0,0,0,.5); }
.preview-dialog-header{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid #ebebeb}
.preview-dialog-header h2{margin:0;font-size:18px}
.preview-dialog-header button{width:38px;height:38px;border:0;border-radius:8px;background:#f7f7f6;cursor:pointer}
.preview-dialog-content{padding:24px 18px;font-size:14px;color:#666;text-align:center;line-height:1.8}
.preview-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:calc(100vw - 32px);padding:12px 16px;color:white;background:#171717;border-radius:10px;text-align:center;font-size:13px;box-shadow:0 8px 24px #0003}
.preview-toast[hidden]{display:none}
</style>
</head>
<body>
<div class="admin-reset-shell">
  <header class="admin-reset-topbar">
    <button type="button" id="open-menu" class="admin-reset-hamburger" aria-label="เปิดเมนู" aria-haspopup="dialog" aria-controls="admin-reset-navigation" aria-expanded="false"><span class="admin-reset-hamburger-lines" aria-hidden="true"><span></span><span></span><span></span></span></button>
    <div class="admin-reset-headline"><div class="admin-reset-kicker">BKK-CUTZ CONTROL</div><h1>จัดการสาขา</h1><div class="admin-reset-email">Admin</div></div>
    <div class="admin-reset-header-actions">
      <div class="notification-center">
        <button id="open-bell" type="button" class="notification-bell" aria-label="การแจ้งเตือน" aria-haspopup="dialog" aria-controls="preview-notifications"><i class="fa-regular fa-bell" aria-hidden="true"></i></button>
      </div>
      <button type="button" id="logout-top" class="admin-reset-header-logout" aria-label="ออกจากระบบ"><i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i><span>ออกจากระบบ</span></button>
    </div>
  </header>
  <main class="admin-reset-canvas" aria-label="พื้นที่ Admin สำหรับออกแบบใหม่"></main>
</div>
<dialog id="admin-reset-navigation" class="admin-reset-menu-dialog" aria-label="เมนู Admin">
  <div class="admin-reset-menu-content">
    <button type="button" class="admin-reset-menu-close" id="close-menu" aria-label="ปิดเมนู">×</button>
    <button type="button" class="admin-reset-logout" id="logout-menu"><i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i> ออกจากระบบ</button>
  </div>
</dialog>
<dialog id="preview-notifications" class="preview-dialog" aria-labelledby="preview-notice-title">
  <div class="preview-dialog-header"><h2 id="preview-notice-title">การแจ้งเตือน</h2><button type="button" id="close-bell" aria-label="ปิดการแจ้งเตือน"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></div>
  <div class="preview-dialog-content">ตัวอย่างหน้าตาเท่านั้น<br/>ยังไม่ได้เชื่อมข้อมูลการแจ้งเตือนจริงในหน้า Preview นี้</div>
</dialog>
<div id="preview-toast" class="preview-toast" role="status" hidden>นี่เป็นหน้า Preview การออกจากระบบใช้ได้เฉพาะในแอปจริง</div>
<script>
const menu=document.getElementById("admin-reset-navigation");
const bell=document.getElementById("preview-notifications");
const hamburger=document.getElementById("open-menu");
const toast=document.getElementById("preview-toast");
function openMenu(){toast.hidden=true;menu.showModal();hamburger.setAttribute("aria-expanded","true");document.getElementById("close-menu").focus();}
hamburger.addEventListener("click",openMenu);
document.getElementById("close-menu").addEventListener("click",()=>menu.close());
menu.addEventListener("click",event=>{if(event.target===menu)menu.close()});
menu.addEventListener("close",()=>{hamburger.setAttribute("aria-expanded","false");hamburger.focus();});
document.getElementById("open-bell").addEventListener("click",()=>{toast.hidden=true;bell.showModal();});
document.getElementById("close-bell").addEventListener("click",()=>bell.close());
bell.addEventListener("click",event=>{if(event.target===bell)bell.close()});
for(const id of ["logout-top","logout-menu"]){document.getElementById(id).addEventListener("click",()=>{if(menu.open)menu.close();toast.hidden=false;});}
</script>
</body>
</html>
