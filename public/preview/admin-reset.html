<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>BKK-CUTZ Admin · Design Preview</title>
  <style>
    *,*::before,*::after{box-sizing:border-box}
    :root{font-family:system-ui,-apple-system,"Noto Sans Thai",Tahoma,sans-serif;color:#171717;color-scheme:light}
    html,body{margin:0;min-height:100%;background:#fff}
    .shell{min-height:100vh;min-height:100dvh;background:#fff}
    .topbar{width:100%;height:68px;padding:0 18px;display:flex;align-items:center;background:#fff;border-bottom:1px solid #e7e7e7}
    .hamburger{display:grid;place-items:center;border:0;background:transparent;color:#171717;border-radius:12px;width:48px;height:48px;cursor:pointer}
    .hamburger:hover,.menu-close:hover,.logout:hover{background:#f3f3f3}
    .hamburger:focus-visible,.menu button:focus-visible{outline:3px solid #333;outline-offset:3px}
    .lines{display:flex;flex-direction:column;gap:5px;width:24px}
    .lines i{display:block;background:currentColor;width:24px;height:2.5px;border-radius:99px}
    main{min-height:calc(100dvh - 68px);background:#fff}
    .menu{position:fixed;inset:0 auto 0 0;margin:0;padding:0;width:min(320px,86vw);height:100vh;height:100dvh;max-width:86vw;max-height:100dvh;border:0;border-radius:0 18px 18px 0;background:#fff;box-shadow:14px 0 45px rgba(0,0,0,.16);color:#171717}
    .menu::backdrop{background:rgba(0,0,0,.44)}
    .menu-content{display:flex;flex-direction:column;height:100%;padding:12px}
    .menu-close{align-self:flex-end;width:48px;height:48px;border:0;background:transparent;border-radius:12px;font-size:29px;color:inherit;cursor:pointer}
    .logout{margin-top:auto;width:100%;min-height:50px;display:flex;align-items:center;gap:10px;padding:0 16px;border:1px solid #e4e4e4;border-radius:12px;background:white;color:#171717;text-align:left;font-size:15px;font-weight:700;cursor:pointer}
    .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:12px 18px;background:#171717;color:white;border-radius:10px;font-size:14px;max-width:calc(100vw - 36px);text-align:center;box-shadow:0 10px 25px #0003}
    .toast[hidden]{display:none}
    @media(max-width:640px){.topbar{height:60px;padding:0 10px}main{min-height:calc(100dvh - 60px)}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <button class="hamburger" id="open-menu" type="button" aria-label="เปิดเมนู" aria-haspopup="dialog" aria-expanded="false" aria-controls="admin-menu">
        <span class="lines" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
    </header>
    <main aria-label="พื้นที่ Admin สำหรับออกแบบใหม่"></main>
  </div>
  <dialog class="menu" id="admin-menu" aria-label="เมนู Admin">
    <div class="menu-content">
      <button type="button" class="menu-close" id="close-menu" aria-label="ปิดเมนู">×</button>
      <button class="logout" type="button" id="logout"><span aria-hidden="true">↪</span>ออกจากระบบ</button>
    </div>
  </dialog>
  <div role="status" class="toast" id="toast" hidden>นี่คือหน้า Preview สำหรับออกแบบ UI ยังไม่ได้เชื่อมกับระบบเข้าสู่ระบบจริง</div>
  <script>
    const modal=document.getElementById('admin-menu');
    const openButton=document.getElementById('open-menu');
    const closeButton=document.getElementById('close-menu');
    const toast=document.getElementById('toast');
    openButton.addEventListener('click',()=>{modal.showModal();openButton.setAttribute('aria-expanded','true');closeButton.focus()});
    closeButton.addEventListener('click',()=>modal.close());
    modal.addEventListener('click',event=>{if(event.target===modal)modal.close()});
    modal.addEventListener('close',()=>{openButton.setAttribute('aria-expanded','false');openButton.focus()});
    document.getElementById('logout').addEventListener('click',()=>{
      modal.close();toast.hidden=false;
    });
    openButton.addEventListener('click',()=>{toast.hidden=true});
  </script>
</body>
</html>
