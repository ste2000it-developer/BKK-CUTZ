<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BKK-CUTZ Admin Import</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      min-height: 100vh;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 24px;

      font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;

      background: #f4f5f7;

      color: #222222;
    }

    .card {
      width: 100%;
      max-width: 520px;

      padding: 30px;

      border: 1px solid #e5e5e5;
      border-radius: 24px;

      background: #ffffff;

      box-shadow:
        0 8px 28px rgba(0, 0, 0, 0.07);
    }

    .brand {
      margin-bottom: 8px;

      text-align: center;

      font-size: 20px;
      font-weight: 800;

      letter-spacing: 2px;
    }

    h1 {
      margin: 0 0 8px;

      text-align: center;

      font-size: 28px;
    }

    .subtitle {
      margin: 0 0 28px;

      text-align: center;

      color: #888888;
    }

    label {
      display: block;

      margin: 16px 0 7px;

      font-weight: 700;
    }

    input {
      width: 100%;

      min-height: 52px;

      padding: 12px 14px;

      border: 1px solid #d8d8d8;
      border-radius: 12px;

      font-size: 17px;

      outline: none;
    }

    input:focus {
      border-color: #222222;
    }

    button {
      width: 100%;

      min-height: 56px;

      margin-top: 20px;

      border: none;
      border-radius: 13px;

      background: #222222;

      color: #ffffff;

      font-size: 17px;
      font-weight: 700;

      cursor: pointer;
    }

    button:disabled {
      opacity: 0.45;

      cursor: not-allowed;
    }

    .secondary {
      background: #e8e8e8;

      color: #333333;
    }

    .status {
      margin-top: 18px;

      padding: 14px;

      border-radius: 12px;

      background: #f1f1f1;

      line-height: 1.6;

      white-space: pre-line;
    }

    .warning {
      margin-top: 20px;

      padding: 15px;

      border-radius: 12px;

      background: #f4f4f4;

      color: #555555;

      font-size: 14px;

      line-height: 1.6;
    }

    .admin-info {
      margin-bottom: 20px;

      padding: 14px;

      border-radius: 12px;

      background: #f4f5f7;
    }

    .hidden {
      display: none !important;
    }

  </style>

</head>


<body>


  <div class="card">


    <div class="brand">
      BKK-CUTZ
    </div>


    <h1>
      Service Import
    </h1>


    <p class="subtitle">
      ตั้งค่ารายการบริการทั้ง 11 สาขา
    </p>



    <!-- ตรวจ session -->

    <div id="loadingArea">

      <div class="status">
        กำลังตรวจสอบบัญชี...
      </div>

    </div>



    <!-- Login Admin -->

    <div
      id="loginArea"
      class="hidden"
    >

      <form id="loginForm">

        <label>
          อีเมล Admin
        </label>

        <input
          id="emailInput"
          type="email"
          autocomplete="username"
          required
        >


        <label>
          รหัสผ่าน
        </label>

        <input
          id="passwordInput"
          type="password"
          autocomplete="current-password"
          required
        >


        <button
          id="loginButton"
          type="submit"
        >
          เข้าสู่ระบบ Admin
        </button>

      </form>


      <div
        id="loginError"
        class="status hidden"
      ></div>

    </div>



    <!-- Import -->

    <div
      id="adminArea"
      class="hidden"
    >

      <div class="admin-info">

        <strong>
          Admin พร้อมใช้งาน
        </strong>

        <div id="adminEmail">
          -
        </div>

      </div>


      <div class="warning">

        การ Import จะล้างข้อมูลใน collection
        <strong>services</strong>
        เดิมทั้งหมด แล้วสร้างรายการบริการใหม่ครบทั้ง 11 สาขา

      </div>


      <button
        id="importButton"
        type="button"
      >
        Import เมนูทั้ง 11 สาขา
      </button>


      <button
        id="logoutButton"
        class="secondary"
        type="button"
      >
        ออกจากระบบ Admin
      </button>


      <div
        id="importStatus"
        class="status hidden"
      ></div>

    </div>


  </div>


  <script
    type="module"
    src="admin-import.js?v=1"
  ></script>


</body>

</html>
