<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Barber POS</title>

  <link
    rel="stylesheet"
    href="pos.css?v=6"
  >
</head>

<body>

  <main class="app">

    <!-- ========================================
         หน้าเลือกช่าง
    ========================================= -->
    <section
      id="barberPage"
      class="page"
    >

      <div class="page-header">

        <h1>เลือกชื่อช่าง</h1>

        <p>
          เลือกชื่อของคุณเพื่อเริ่มบันทึกรายการ
        </p>

      </div>

      <div
        id="barberList"
        class="barber-grid"
      ></div>

    </section>


    <!-- ========================================
         หน้าเลือกบริการ
    ========================================= -->
    <section
      id="servicePage"
      class="page hidden"
    >

      <button
        id="backButton"
        class="back-button"
        type="button"
      >
        ← กลับ
      </button>


      <div class="page-header">

        <p class="selected-label">
          ช่างที่เลือก
        </p>

        <h1 id="selectedBarberName">
          -
        </h1>

        <p>
          เลือกบริการที่ทำให้ลูกค้า
        </p>

      </div>


      <div
        id="serviceList"
        class="service-list"
      ></div>


      <!-- ========================================
           สรุปรายการ
      ========================================= -->
      <div class="summary-card">

        <h2>
          สรุปรายการ
        </h2>


        <div
          id="summaryList"
          class="summary-list"
        >

          <p class="empty-summary">
            ยังไม่ได้เลือกบริการ
          </p>

        </div>


        <div class="summary-total">

          <span>
            รวมทั้งหมด
          </span>

          <strong id="totalPrice">
            0 บาท
          </strong>

        </div>


        <button
          id="confirmButton"
          class="confirm-button"
          type="button"
          disabled
        >
          ยืนยันรายการ
        </button>

      </div>

    </section>

  </main>


  <!-- ========================================
       เลือกวิธีชำระเงิน
  ========================================= -->
  <div
    id="paymentModal"
    class="payment-modal hidden"
  >

    <div class="payment-backdrop"></div>


    <div class="payment-dialog">

      <h2>
        เลือกวิธีชำระเงิน
      </h2>

      <p class="payment-total-label">
        ยอดที่ต้องชำระ
      </p>

      <div
        id="paymentTotal"
        class="payment-total"
      >
        0 บาท
      </div>


      <div class="payment-options">

        <button
          id="cashPaymentButton"
          class="payment-button"
          type="button"
        >
          <span class="payment-icon">
            💵
          </span>

          <span class="payment-name">
            เงินสด
          </span>
        </button>


        <button
          id="scanPaymentButton"
          class="payment-button"
          type="button"
        >
          <span class="payment-icon">
            📱
          </span>

          <span class="payment-name">
            สแกนจ่าย
          </span>
        </button>

      </div>


      <button
        id="cancelPaymentButton"
        class="cancel-payment-button"
        type="button"
      >
        ยกเลิก
      </button>

    </div>

  </div>


  <script
    type="module"
    src="app.js?v=6"
  ></script>

</body>
</html>
