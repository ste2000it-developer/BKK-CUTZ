<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>BKK-CUTZ POS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
  >

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css"
  >

  <link
    rel="stylesheet"
    href="pos.css"
  >
</head>

<body>
  <div id="posReactRoot">
    <div id="posStartupFallback" style="font-family:system-ui,sans-serif;text-align:center;padding:64px 20px;color:#253247">
      <strong style="font-size:22px">BKK-CUTZ</strong>
      <p id="posStartupMessage">กำลังเปิดระบบ...</p>
      <button id="posStartupRetry" type="button" style="display:none;padding:12px 24px;border:0;border-radius:10px;background:#253247;color:white;font-size:16px" onclick="location.reload()">ลองใหม่</button>
    </div>
  </div>
  <script>
    (function () {
      var failed = false;
      function showFailure(reason) {
        if (failed || !document.getElementById("posStartupFallback")) return;
        failed = true;
        console.error("POS startup failed:", reason);
        document.getElementById("posStartupMessage").textContent = "ไม่สามารถเปิดระบบได้ กรุณาลองใหม่อีกครั้ง";
        document.getElementById("posStartupRetry").style.display = "inline-block";
      }
      window.addEventListener("error", function (event) {
        if (document.getElementById("posStartupFallback")) showFailure(event.message || "Resource loading error");
      }, true);
      window.addEventListener("unhandledrejection", function (event) {
        if (document.getElementById("posStartupFallback")) showFailure(event.reason || "Unhandled startup rejection");
      });
      window.setTimeout(function () {
        if (document.getElementById("posStartupFallback")) showFailure("Startup timed out after 15 seconds");
      }, 15000);
    })();
  </script>
  <script type="module" src="/src/pos/main.tsx"></script>
</body>
</html>
