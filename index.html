<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Barber POS</title>

  <link
    rel="stylesheet"
    href="pos.css?v=8"
  >
</head>

<body>

  <main class="app">

    <!-- ========================================
         หน้าเลือกช่าง
    ========================================= -->
    <section
      id="barberPage"
      class="page"
    >

      <div class="page-header">

        <h1>เลือกชื่อช่าง</h1>

        <p>
          เลือกชื่อของคุณเพื่อเริ่มบันทึกรายการ
        </p>

      </div>


      <div
        id="barberList"
        class="barber-grid"
      ></div>

    </section>


    <!-- ========================================
         หน้าเลือกบริการ
    ========================================= -->
    <section
      id="servicePage"
      class="page hidden"
    >

      <button
        id="backButton"
        class="back-button"
        type="button"
      >
        ← กลับ
      </button>


      <div class="page-header">

        <p class="selected-label">
          ช่างที่เลือก
        </p>

        <h1 id="selectedBarberName">
          -
        </h1>

        <p>
          เลือกบริการที่ทำให้ลูกค้า
        </p>

      </div>


      <!-- รายการบริการ -->
      <div
        id="serviceList"
        class="service-list"
      ></div>


      <!-- ========================================
           สรุปรายการ
      ========================================= -->
      <div class="summary-card">

        <h2>
          สรุปรายการ
        </h2>


        <div
          id="summaryList"
          class="summary-list"
        >

          <p class="empty-summary">
            ยังไม่ได้เลือกบริการ
          </p>

        </div>


        <div class="summary-total">

          <span>
            รวมทั้งหมด
          </span>

          <strong id="totalPrice">
            0 บาท
          </strong>

        </div>


        <button
          id="confirmButton"
          class="confirm-button"
          type="button"
          disabled
        >
          ยืนยันรายการ
        </button>

      </div>

    </section>


    <!-- ========================================
         หน้าบันทึกรายการสำเร็จ
    ========================================= -->
    <section
      id="successPage"
      class="page hidden"
    >

      <div class="success-wrapper">

        <div class="success-icon">
          ✓
        </div>


        <h1 class="success-title">
          บันทึกรายการแล้ว
        </h1>

        <p class="success-subtitle">
          รายการได้รับการยืนยันเรียบร้อย
        </p>


        <!-- ========================================
             รายละเอียดรายการ
        ========================================= -->
        <div class="success-card">

          <div class="success-info-row">

            <span>
              ช่าง
            </span>

            <strong id="successBarberName">
              -
            </strong>

          </div>


          <div class="success-divider"></div>


          <div
            id="successServiceList"
            class="success-service-list"
          ></div>


          <div class="success-divider"></div>


          <div class="success-info-row success-total-row">

            <span>
              รวมทั้งหมด
            </span>

            <strong id="successTotal">
              0 บาท
            </strong>

          </div>


          <div class="success-info-row">

            <span>
              ชำระด้วย
            </span>

            <strong id="successPaymentMethod">
              -
            </strong>

          </div>

        </div>


        <button
          id="homeButton"
          class="home-button"
          type="button"
        >
          กลับหน้าหลัก
        </button>

      </div>

    </section>

  </main>


  <!-- ========================================
       เลือกวิธีชำระเงิน
  ========================================= -->
  <div
    id="paymentModal"
    class="payment-modal hidden"
  >

    <div class="payment-backdrop"></div>


    <div class="payment-dialog">

      <div class="payment-header">

        <h2>
          เลือกวิธีชำระเงิน
        </h2>

        <p>
          ยอดที่ต้องชำระ
        </p>

        <strong id="paymentTotal">
          0 บาท
        </strong>

      </div>


      <!-- ========================================
           เงินสด
      ========================================= -->
      <button
        id="cashPaymentButton"
        class="payment-card"
        type="button"
      >

        <span class="payment-card-icon">

          <svg
            viewBox="0 0 100 70"
            aria-hidden="true"
          >

            <rect
              x="5"
              y="8"
              width="90"
              height="54"
              rx="8"
              fill="none"
              stroke="currentColor"
              stroke-width="5"
            />

            <circle
              cx="50"
              cy="35"
              r="14"
              fill="none"
              stroke="currentColor"
              stroke-width="5"
            />

            <path
              d="M14 22 C24 22 28 18 30 13"
              fill="none"
              stroke="currentColor"
              stroke-width="4"
              stroke-linecap="round"
            />

            <path
              d="M86 48 C76 48 72 52 70 57"
              fill="none"
              stroke="currentColor"
              stroke-width="4"
              stroke-linecap="round"
            />

          </svg>

        </span>


        <span class="payment-card-title">
          เงินสด
        </span>

      </button>


      <!-- ========================================
           สแกนจ่าย
      ========================================= -->
      <button
        id="scanPaymentButton"
        class="payment-card"
        type="button"
      >

        <span class="payment-card-icon qr-icon">

          <svg
            viewBox="0 0 100 100"
            aria-hidden="true"
          >

            <rect
              x="8"
              y="8"
              width="30"
              height="30"
              rx="2"
              fill="none"
              stroke="currentColor"
              stroke-width="6"
            />

            <rect
              x="17"
              y="17"
              width="12"
              height="12"
              fill="currentColor"
            />


            <rect
              x="62"
              y="8"
              width="30"
              height="30"
              rx="2"
              fill="none"
              stroke="currentColor"
              stroke-width="6"
            />

            <rect
              x="71"
              y="17"
              width="12"
              height="12"
              fill="currentColor"
            />


            <rect
              x="8"
              y="62"
              width="30"
              height="30"
              rx="2"
              fill="none"
              stroke="currentColor"
              stroke-width="6"
            />

            <rect
              x="17"
              y="71"
              width="12"
              height="12"
              fill="currentColor"
            />


            <rect
              x="52"
              y="52"
              width="10"
              height="10"
              fill="currentColor"
            />

            <rect
              x="70"
              y="52"
              width="10"
              height="10"
              fill="currentColor"
            />

            <rect
              x="52"
              y="70"
              width="10"
              height="10"
              fill="currentColor"
            />

            <rect
              x="68"
              y="68"
              width="24"
              height="8"
              fill="currentColor"
            />

            <rect
              x="84"
              y="76"
              width="8"
              height="16"
              fill="currentColor"
            />

            <rect
              x="52"
              y="84"
              width="22"
              height="8"
              fill="currentColor"
            />

          </svg>

        </span>


        <span class="payment-card-title">
          สแกนจ่าย
        </span>

      </button>


      <button
        id="cancelPaymentButton"
        class="cancel-payment-button"
        type="button"
      >
        ← กลับ
      </button>

    </div>

  </div>


  <script
    type="module"
    src="app.js?v=8"
  ></script>

</body>
</html>
